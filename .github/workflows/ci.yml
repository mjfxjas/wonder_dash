name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine bandit

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .

      - name: Verify installation
        run: |
          .venv/bin/wonder-dash --help
          .venv/bin/wonder-dash --version
          .venv/bin/python -c "import wonder_dash; print(f'Wonder Dash {wonder_dash.__version__}')"

      - name: Run offline regression tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Verify runtime dependencies
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python -c "import awscrt; from awscrt import crypto"

      - name: Bandit security scan
        if: matrix.python-version == '3.11'
        run: bandit -r src/wonder_dash --severity-level medium --confidence-level medium

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*
